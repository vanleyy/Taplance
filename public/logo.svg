<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Taplance logo">
  <defs>
    <linearGradient id="tpl-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#tpl-grad)"/>

  <!-- Inner highlight ring -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>

  <!-- Chain link: two half-rings joined by a center node (the "tap") -->
  <g transform="translate(16,16) scale(20)" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
    <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
    <circle cx="12" cy="12" r="2" fill="#ffffff" stroke="none"/>
  </g>
</svg>
